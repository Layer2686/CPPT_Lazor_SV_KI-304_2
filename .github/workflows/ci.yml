name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            LAB_01/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -Dbuild.number=${{ github.run_number }} clean verify

      - name: Verify with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B "-Dbuild.number=${{ github.run_number }}" clean verify

      - name: Run and check executable JAR
        shell: pwsh
        run: |
          $jarPath = 'LAB_01/target/lab01.jar'
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
            throw "Executable JAR is missing: $jarPath"
          }

          $output = @(& java -jar $jarPath)
          if ($LASTEXITCODE -ne 0) {
            throw "JAR exited with code $LASTEXITCODE"
          }
          if ($output.Count -ne 67) {
            throw "Expected 67 output lines, got $($output.Count)"
          }
          foreach ($line in $output) {
            if ($line -cne 'Hello, world!') {
              throw "Unexpected output line: $line"
            }
          }
          Write-Output 'JAR check passed: 67 expected lines.'

      - name: Check version and CI build number
        shell: pwsh
        run: |
          $jarPath = 'LAB_01/target/lab01.jar'
          $expected = 'lab01 1.0.0 (build ${{ github.run_number }})'
          $actual = @(& java -jar $jarPath --version)
          if ($LASTEXITCODE -ne 0) {
            throw "Version command exited with code $LASTEXITCODE"
          }
          if ($actual.Count -ne 1 -or $actual[0] -cne $expected) {
            throw "Expected '$expected', got '$($actual -join ', ')'"
          }
          Write-Output "Version check passed: $expected"

      - name: Upload executable JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab01-${{ runner.os }}-${{ github.run_number }}
          path: LAB_01/target/lab01.jar
          if-no-files-found: error
