name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            LAB_01/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -Dbuild.number=${{ github.run_number }} clean verify

      - name: Verify with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B "-Dbuild.number=${{ github.run_number }}" clean verify

      - name: Run and check executable JAR
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $jarPath = 'LAB_01/target/lab01.jar'
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
            throw "Executable JAR is missing: $jarPath"
          }

          $jarPath = (Resolve-Path -LiteralPath $jarPath).Path
          $inputPath = (Resolve-Path -LiteralPath 'LAB_01/data/input.csv').Path
          $testDirectory = Join-Path $env:RUNNER_TEMP 'lab01-report'
          New-Item -ItemType Directory -Path $testDirectory -Force | Out-Null
          Push-Location $testDirectory
          try {
            # A filename without a parent must work from a temporary working directory.
            $output = @(& java '-Dstdout.encoding=UTF-8' '-Dstderr.encoding=UTF-8' -jar $jarPath --input $inputPath --output report.txt)
            if ($LASTEXITCODE -ne 0) {
              throw "JAR exited with code $LASTEXITCODE"
            }
            $report = Get-Content -LiteralPath 'report.txt' -Raw -Encoding utf8
          } finally {
            Pop-Location
          }
          $expectedLines = @(
            'Мінімальна температура: -5.50 °C'
            'Максимальна швидкість вітру: 7.50 м/с'
            'Середній рівень вологості: 70.00 %'
            'Кількість коректних записів: 3'
          )
          foreach ($line in $expectedLines) {
            if ($output -cnotcontains $line) {
              throw "Expected JAR output line is missing: $line"
            }
          }
          $consoleText = ($output -join [Environment]::NewLine) + [Environment]::NewLine
          if ([string]::IsNullOrEmpty($report) -or -not $consoleText.EndsWith($report)) {
            throw 'Console and UTF-8 file reports differ'
          }
          Write-Output 'JAR check passed: summary and UTF-8 report.txt without a parent directory.'

      - name: Check version and CI build number
        shell: pwsh
        run: |
          $jarPath = 'LAB_01/target/lab01.jar'
          $expected = 'lab01 1.0.0 (build ${{ github.run_number }})'
          $actual = @(& java -jar $jarPath --version)
          if ($LASTEXITCODE -ne 0) {
            throw "Version command exited with code $LASTEXITCODE"
          }
          if ($actual.Count -ne 1 -or $actual[0] -cne $expected) {
            throw "Expected '$expected', got '$($actual -join ', ')'"
          }
          Write-Output "Version check passed: $expected"

      - name: Upload executable JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab01-${{ runner.os }}-${{ github.run_number }}
          path: LAB_01/target/lab01.jar
          if-no-files-found: error
