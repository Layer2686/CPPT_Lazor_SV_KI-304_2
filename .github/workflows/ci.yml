name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            LAB_01/pom.xml
            LAB_02/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven Wrapper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -Dbuild.number=${{ github.run_number }} clean verify

      - name: Verify with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B "-Dbuild.number=${{ github.run_number }}" clean verify

      - name: Check both JARs, versions and identical reports
        shell: pwsh
        run: ./.github/scripts/check-jars.ps1 -BuildNumber '${{ github.run_number }}'

      - name: Generate LAB_02 Javadoc
        shell: pwsh
        run: |
          $sources = @(Get-ChildItem 'LAB_02/src/main/java' -Recurse -Filter '*.java' | ForEach-Object { $_.FullName })
          & javadoc -Werror -encoding UTF-8 -charset UTF-8 -docencoding UTF-8 -d LAB_02/target/apidocs @sources
          if ($LASTEXITCODE -ne 0) {
            throw "Javadoc exited with code $LASTEXITCODE"
          }

      - name: Upload LAB_01 executable JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab01-${{ runner.os }}-${{ github.run_number }}
          path: LAB_01/target/lab01.jar
          if-no-files-found: error

      - name: Upload LAB_02 executable JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab02-${{ runner.os }}-${{ github.run_number }}
          path: LAB_02/target/lab02.jar
          if-no-files-found: error
